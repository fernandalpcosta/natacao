name: Enviar treino ao Garmin

on:
  workflow_dispatch:
    inputs:
      treino:
        description: "Treino (nome do arquivo em treinos/, sem .json)"
        type: choice
        options:
          - 1-teste-css
          - 2-velocidade
          - 3-limiar
      data:
        description: "Dia do treino (AAAA-MM-DD). Vazio = só criar, sem agendar"
        required: false
        default: ""

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sync/enviar_treino.py "${{ inputs.treino }}" "${{ inputs.data }}"
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
